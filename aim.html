<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a14">
    <title>Aim Trainer — Ruslaanchik</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
        body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: radial-gradient(ellipse at 50% 50%, #1a1f35 0%, #0a0a14 100%); color: #fff; position: relative; }

        .top-bar { position: fixed; top: 0; left: 0; right: 0; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: center; z-index: 100; background: linear-gradient(to bottom, rgba(10, 10, 20, 0.9), transparent); pointer-events: none; }
        .top-bar > * { pointer-events: auto; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); color: #fff; font-size: 0.9rem; font-weight: 500; font-family: inherit; text-decoration: none; cursor: pointer; transition: background 0.2s, transform 0.15s; min-height: 44px; }
        .back-btn:hover { background: rgba(255, 255, 255, 0.12); }
        .back-btn:active { transform: scale(0.95); }

        .hud { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-radius: 30px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hud-item { display: flex; flex-direction: column; align-items: center; min-width: 50px; }
        .hud-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; color: #8da2c0; font-weight: 600; }
        .hud-value { font-size: 1.15rem; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }

        .game-area { position: absolute; inset: 0; cursor: crosshair; overflow: hidden; }

        .target { position: absolute; width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #e0e0e0 30%, #ff4444 60%, #8b0000 100%); border: 4px solid #fff; box-shadow: 0 0 30px rgba(255, 68, 68, 0.7), inset 0 0 20px rgba(0, 0, 0, 0.3); cursor: pointer; animation: pop 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); will-change: transform, opacity; }
        @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
        .target.hit { animation: hitAnim 0.3s ease-out forwards; pointer-events: none; }
        @keyframes hitAnim { 0% { transform: scale(1); opacity: 1; background: #ffaa00; } 50% { transform: scale(1.3); opacity: 0.8; } 100% { transform: scale(1.6); opacity: 0; } }
        .target::before { content: ''; position: absolute; inset: 20%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #ff6666 100%); box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.4); pointer-events: none; }

        .hit-particle { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #ffaa00; pointer-events: none; animation: particleFly 0.6s ease-out forwards; box-shadow: 0 0 10px #ffaa00; }
        @keyframes particleFly { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; } }

        .score-popup { position: absolute; font-size: 1.8rem; font-weight: 800; color: #ffaa00; pointer-events: none; text-shadow: 0 0 20px #ffaa00, 0 2px 4px rgba(0, 0, 0, 0.8); animation: scoreFloat 0.8s ease-out forwards; z-index: 50; }
        @keyframes scoreFloat { 0% { transform: translateY(0) scale(0.5); opacity: 0; } 30% { transform: translateY(-20px) scale(1.3); opacity: 1; } 100% { transform: translateY(-60px) scale(1); opacity: 0; } }

        .combo-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(3rem, 12vw, 6rem); font-weight: 900; background: linear-gradient(135deg, #ffaa00, #ff4444); -webkit-background-clip: text; background-clip: text; color: transparent; pointer-events: none; z-index: 200; animation: comboAnim 0.7s ease-out forwards; letter-spacing: -0.05em; }
        @keyframes comboAnim { 0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; } 40% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1) translateY(-30px); opacity: 0; } }

        .miss-effect { position: absolute; width: 60px; height: 60px; border-radius: 50%; border: 3px solid rgba(255, 68, 68, 0.8); pointer-events: none; animation: missAnim 0.5s ease-out forwards; margin-left: -30px; margin-top: -30px; }
        @keyframes missAnim { 0% { transform: scale(0.3); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

        .overlay { position: fixed; inset: 0; background: rgba(10, 10, 20, 0.92); backdrop-filter: blur(20px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 20px; text-align: center; z-index: 500; transition: opacity 0.4s, visibility 0.4s; overflow-y: auto; }
        .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .overlay h1 { font-size: clamp(1.8rem, 8vw, 3rem); font-weight: 900; line-height: 1.1; background: linear-gradient(135deg, #fff, #9146ff, #6ec6a0); background-size: 200% 200%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: gradientMove 4s ease infinite; letter-spacing: -0.02em; }
        @keyframes gradientMove { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

        .crosshair-icon { font-size: 4.5rem; animation: rotate 3s ease-in-out infinite; filter: drop-shadow(0 0 30px rgba(145, 70, 255, 0.8)); }
        @keyframes rotate { 0%, 100% { transform: rotate(-15deg) scale(1); } 50% { transform: rotate(15deg) scale(1.1); } }

        .overlay p { color: #b8c7dd; font-size: 0.95rem; line-height: 1.6; max-width: 420px; }

        .name-input { width: 100%; max-width: 320px; padding: 14px 20px; border-radius: 16px; border: 2px solid rgba(255, 255, 255, 0.15); background: rgba(255, 255, 255, 0.05); color: #fff; font-size: 1.05rem; font-family: inherit; text-align: center; outline: none; transition: border-color 0.2s; -webkit-appearance: none; appearance: none; }
        .name-input:focus { border-color: #9146ff; }
        .name-input::placeholder { color: #6b7a94; }

        .mode-buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .mode-btn { padding: 12px 20px; border-radius: 50px; border: 2px solid rgba(255, 255, 255, 0.15); background: rgba(255, 255, 255, 0.05); color: #fff; font-size: 0.9rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.2s; min-width: 100px; }
        .mode-btn:hover { background: rgba(255, 255, 255, 0.12); transform: translateY(-2px); }
        .mode-btn.selected { background: linear-gradient(135deg, #9146ff, #6ec6a0); border-color: transparent; box-shadow: 0 10px 30px -5px rgba(145, 70, 255, 0.6); transform: translateY(-2px); }

        .play-btn { padding: 16px 44px; border-radius: 50px; border: none; background: linear-gradient(135deg, #9146ff, #6ec6a0); color: #fff; font-size: 1.15rem; font-weight: 800; font-family: inherit; cursor: pointer; transition: transform 0.2s; box-shadow: 0 15px 40px -10px rgba(145, 70, 255, 0.7); text-transform: uppercase; letter-spacing: 2px; animation: pulse-btn 2s ease-in-out infinite; }
        @keyframes pulse-btn { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .play-btn:hover { transform: scale(1.08); }
        .play-btn:active { transform: scale(0.98); }

        .best-score { display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; border-radius: 30px; background: rgba(255, 170, 0, 0.1); border: 1px solid rgba(255, 170, 0, 0.3); color: #ffaa00; font-size: 0.9rem; font-weight: 600; }

        .result-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 420px; }
        .result-stat { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 18px; padding: 14px; text-align: center; }
        .result-stat .value { font-size: 1.8rem; font-weight: 800; color: #fff; line-height: 1; font-variant-numeric: tabular-nums; }
        .result-stat .value.gold { color: #ffaa00; }
        .result-stat .value.green { color: #6ec6a0; }
        .result-stat .value.purple { color: #c2a4ff; }
        .result-stat .label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1.5px; color: #8da2c0; margin-top: 6px; font-weight: 600; }

        .new-record { display: inline-block; padding: 6px 16px; border-radius: 20px; background: linear-gradient(135deg, #ffaa00, #ff6600); color: #fff; font-size: 0.8rem; font-weight: 800; letter-spacing: 1px; animation: pulse-btn 1s ease-in-out infinite; text-transform: uppercase; }

        .result-buttons { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
        .result-buttons button { padding: 14px 26px; border-radius: 50px; border: none; font-family: inherit; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: transform 0.15s; min-height: 50px; }
        .result-buttons button:active { transform: scale(0.95); }
        .btn-again { background: linear-gradient(135deg, #9146ff, #6ec6a0); color: #fff; box-shadow: 0 10px 30px -8px rgba(145, 70, 255, 0.6); }
        .btn-menu { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid rgba(255, 255, 255, 0.15) !important; }

        .leaderboard { width: 100%; max-width: 480px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 22px; padding: 16px; }
        .leaderboard-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .leaderboard-header h3 { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #6ec6a0; box-shadow: 0 0 10px #6ec6a0; animation: pulse-dot 2s ease-in-out infinite; }
        @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }
        .lb-list { display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow-y: auto; }
        .lb-empty { text-align: center; color: #6b7a94; font-size: 0.85rem; padding: 1rem 0; font-style: italic; }
        .lb-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); animation: slideIn 0.4s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .lb-rank { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #8da2c0; flex-shrink: 0; }
        .lb-item:nth-child(1) .lb-rank { background: linear-gradient(135deg, #ffd700, #ffb800); color: #4a3800; border: none; box-shadow: 0 0 12px rgba(255, 215, 0, 0.5); }
        .lb-item:nth-child(2) .lb-rank { background: linear-gradient(135deg, #e0e0e0, #a8a8a8); color: #2a2a2a; border: none; }
        .lb-item:nth-child(3) .lb-rank { background: linear-gradient(135deg, #cd7f32, #a05a20); color: #fff; border: none; }
        .lb-name { flex: 1; font-size: 0.85rem; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
        .lb-name.me { color: #ffaa00; font-weight: 700; }
        .lb-score { font-size: 0.85rem; font-weight: 700; color: #6ec6a0; padding: 3px 10px; border-radius: 10px; background: rgba(110, 198, 160, 0.1); border: 1px solid rgba(110, 198, 160, 0.2); }

        @media (max-width: 600px) {
            .target { width: 70px; height: 70px; }
            .hud-item { min-width: 42px; }
            .hud-value { font-size: 1rem; }
            .hud { padding: 8px 12px; gap: 8px; }
            .back-btn { padding: 8px 12px; font-size: 0.8rem; min-height: 40px; }
            .score-popup { font-size: 1.4rem; }
            .leaderboard { padding: 12px; }
            .lb-list { max-height: 200px; }
        }
    </style>
</head>
<body>

    <div class="game-area" id="gameArea"></div>

    <div class="top-bar">
        <a href="index.html" class="back-btn">
            <span>←</span>
            <span>На главную</span>
        </a>
        <div class="hud" id="hud" style="display: none;">
            <div class="hud-item">
                <div class="hud-label">Время</div>
                <div class="hud-value" id="hudTime">30</div>
            </div>
            <div class="hud-item">
                <div class="hud-label">Очки</div>
                <div class="hud-value" id="hudScore">0</div>
            </div>
            <div class="hud-item">
                <div class="hud-label">Комбо</div>
                <div class="hud-value" id="hudCombo">x1</div>
            </div>
        </div>
    </div>

    <div class="overlay" id="startScreen">
        <div class="crosshair-icon">🎯</div>
        <h1>Aim Trainer</h1>
        <p>Проверь свою реакцию и меткость! Кликай по мишеням как можно быстрее.</p>
        <input type="text" class="name-input" id="nameInput" placeholder="Введи свой ник" maxlength="20" autocomplete="off">
        <div class="best-score" id="bestScoreBox" style="display: none;">
            <span>🏆</span>
            <span>Личный рекорд: <strong id="bestScoreValue">0</strong></span>
        </div>
        <div class="mode-buttons">
            <button class="mode-btn" data-duration="15">⚡ 15 сек</button>
            <button class="mode-btn selected" data-duration="30">🎯 30 сек</button>
            <button class="mode-btn" data-duration="60">🔥 60 сек</button>
        </div>
        <button class="play-btn" id="playBtn">Играть</button>
        <div class="leaderboard">
            <div class="leaderboard-header">
                <h3><span>🏆</span> Топ игроков</h3>
                <span class="live-dot" title="Обновляется в реальном времени"></span>
            </div>
            <div class="lb-list" id="leaderboard">
                <div class="lb-empty">Загрузка...</div>
            </div>
        </div>
    </div>

    <div class="overlay hidden" id="resultScreen">
        <h1 id="resultTitle">Время вышло!</h1>
        <div class="new-record" id="newRecord" style="display: none;">🏆 Новый рекорд!</div>
        <div class="result-stats">
            <div class="result-stat">
                <div class="value gold" id="resultScore">0</div>
                <div class="label">Очки</div>
            </div>
            <div class="result-stat">
                <div class="value green" id="resultAccuracy">0%</div>
                <div class="label">Точность</div>
            </div>
            <div class="result-stat">
                <div class="value purple" id="resultHits">0</div>
                <div class="label">Попаданий</div>
            </div>
            <div class="result-stat">
                <div class="value" id="resultMaxCombo">x0</div>
                <div class="label">Макс. комбо</div>
            </div>
        </div>
        <div id="saveStatus" style="font-size: 0.85rem; color: #8da2c0;">Сохраняю в топ...</div>
        <div class="result-buttons">
            <button class="btn-again" id="againBtn">🔄 Ещё раз</button>
            <button class="btn-menu" id="menuBtn">🏠 В меню</button>
        </div>
        <div class="leaderboard">
            <div class="leaderboard-header">
                <h3><span>🏆</span> Топ игроков</h3>
                <span class="live-dot"></span>
            </div>
            <div class="lb-list" id="leaderboard2">
                <div class="lb-empty">Загрузка...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, push, onValue, query, orderByChild, limitToLast } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBJhK6WR2N3e0SYf5TMLiwloRWTvWHeYTg",
            authDomain: "ruslaanchik-4e266.firebaseapp.com",
            databaseURL: "https://ruslaanchik-4e266-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "ruslaanchik-4e266",
            storageBucket: "ruslaanchik-4e266.firebasestorage.app",
            messagingSenderId: "218938988831",
            appId: "1:218938988831:web:9a779ff712c63852fe782a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const scoresRef = query(ref(db, 'scores'), orderByChild('timestamp'), limitToLast(100));

        function renderLeaderboard(scores) {
            const lists = [document.getElementById('leaderboard'), document.getElementById('leaderboard2')];
            const myName = localStorage.getItem('aim_player_name') || '';
            const sorted = scores.sort((a, b) => b.score - a.score || b.timestamp - a.timestamp).slice(0, 15);

            if (!sorted.length) {
                lists.forEach(el => { if (el) el.innerHTML = '<div class="lb-empty">Пока никто не играл. Будь первым! 🎯</div>'; });
                return;
            }

            const html = sorted.map((s, i) => `
                <div class="lb-item">
                    <div class="lb-rank">${i + 1}</div>
                    <div class="lb-name ${s.name === myName ? 'me' : ''}">${escapeHtml(s.name)}</div>
                    <div class="lb-score">${s.score}</div>
                </div>
            `).join('');

            lists.forEach(el => { if (el) el.innerHTML = html; });
        }

        onValue(scoresRef, (snapshot) => {
            const data = snapshot.val();
            renderLeaderboard(data ? Object.values(data) : []);
        });

        async function saveScore(name, score) {
            try {
                await push(ref(db, 'scores'), { name: name.slice(0, 20), score, timestamp: Date.now() });
                return true;
            } catch (e) {
                console.error('Ошибка:', e);
                return false;
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        const gameArea = document.getElementById('gameArea');
        const hud = document.getElementById('hud');
        const hudTime = document.getElementById('hudTime');
        const hudScore = document.getElementById('hudScore');
        const hudCombo = document.getElementById('hudCombo');
        const startScreen = document.getElementById('startScreen');
        const resultScreen = document.getElementById('resultScreen');
        const playBtn = document.getElementById('playBtn');
        const againBtn = document.getElementById('againBtn');
        const menuBtn = document.getElementById('menuBtn');
        const nameInput = document.getElementById('nameInput');
        const resultScore = document.getElementById('resultScore');
        const resultAccuracy = document.getElementById('resultAccuracy');
        const resultHits = document.getElementById('resultHits');
        const resultMaxCombo = document.getElementById('resultMaxCombo');
        const resultTitle = document.getElementById('resultTitle');
        const newRecordEl = document.getElementById('newRecord');
        const bestScoreBox = document.getElementById('bestScoreBox');
        const bestScoreValue = document.getElementById('bestScoreValue');
        const saveStatus = document.getElementById('saveStatus');

        const savedName = localStorage.getItem('aim_player_name');
        if (savedName) nameInput.value = savedName;

        let state = { playing: false, score: 0, hits: 0, misses: 0, combo: 0, maxCombo: 0, timeLeft: 30, duration: 30, timerInterval: null, currentTarget: null };

        const BEST_KEY = 'aim_best_score';

        function showBestScore() {
            const best = localStorage.getItem(BEST_KEY);
            if (best && best > 0) {
                bestScoreBox.style.display = 'inline-flex';
                bestScoreValue.textContent = best;
            } else {
                bestScoreBox.style.display = 'none';
            }
        }
        showBestScore();

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                state.duration = parseInt(btn.dataset.duration);
            });
        });

        function startGame() {
            const name = nameInput.value.trim() || 'Аноним';
            localStorage.setItem('aim_player_name', name);

            state.playing = true;
            state.score = 0; state.hits = 0; state.misses = 0;
            state.combo = 0; state.maxCombo = 0;
            state.timeLeft = state.duration;

            gameArea.innerHTML = '';
            hud.style.display = 'flex';
            startScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');

            updateHUD();
            spawnTarget();

            clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                state.timeLeft--;
                updateHUD();
                if (state.timeLeft <= 0) endGame();
            }, 1000);
        }

        function updateHUD() {
            hudTime.textContent = state.timeLeft;
            hudScore.textContent = state.score;
            hudCombo.textContent = 'x' + Math.max(state.combo, 1);
        }

        function spawnTarget() {
            if (!state.playing) return;
            if (state.currentTarget) state.currentTarget.remove();

            const isMobile = window.innerWidth < 600;
            const size = isMobile ? 70 : 90;
            const padding = 20;
            const maxX = window.innerWidth - size - padding * 2;
            const maxY = window.innerHeight - size - padding * 4;
            const x = Math.random() * maxX + padding;
            const y = Math.random() * maxY + padding * 3;

            const target = document.createElement('div');
            target.className = 'target';
            target.style.left = x + 'px';
            target.style.top = y + 'px';
            target.style.width = size + 'px';
            target.style.height = size + 'px';

            target.addEventListener('click', (e) => {
                e.stopPropagation();
                hitTarget(target, e.clientX, e.clientY);
            });

            target.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                const t = e.touches[0];
                hitTarget(target, t.clientX, t.clientY);
            }, { passive: false });

            gameArea.appendChild(target);
            state.currentTarget = target;
        }

        function hitTarget(target, x, y) {
            if (!state.playing) return;
            state.hits++;
            state.combo++;
            if (state.combo > state.maxCombo) state.maxCombo = state.combo;

            const comboBonus = Math.min(state.combo - 1, 10) * 10;
            const points = 100 + comboBonus;
            state.score += points;

            const popup = document.createElement('div');
            popup.className = 'score-popup';
            popup.textContent = '+' + points;
            popup.style.left = (x - 30) + 'px';
            popup.style.top = (y - 30) + 'px';
            document.body.appendChild(popup);
            setTimeout(() => popup.remove(), 800);

            for (let i = 0; i < 8; i++) {
                const p = document.createElement('div');
                p.className = 'hit-particle';
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                const angle = (Math.PI * 2 * i) / 8;
                p.style.setProperty('--tx', Math.cos(angle) * 80 + 'px');
                p.style.setProperty('--ty', Math.sin(angle) * 80 + 'px');
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 600);
            }

            if (state.combo % 5 === 0 && state.combo >= 5) {
                const combo = document.createElement('div');
                combo.className = 'combo-popup';
                combo.textContent = 'x' + state.combo;
                document.body.appendChild(combo);
                setTimeout(() => combo.remove(), 700);
            }

            target.classList.add('hit');
            setTimeout(() => {
                if (target.parentNode) target.remove();
                spawnTarget();
            }, 200);

            updateHUD();
        }

        function endGame() {
            state.playing = false;
            clearInterval(state.timerInterval);
            if (state.currentTarget) state.currentTarget.remove();

            const total = state.hits + state.misses;
            const accuracy = total > 0 ? Math.round((state.hits / total) * 100) : 100;

            resultScore.textContent = state.score;
            resultAccuracy.textContent = accuracy + '%';
            resultHits.textContent = state.hits;
            resultMaxCombo.textContent = 'x' + state.maxCombo;
            resultTitle.textContent = 'Время вышло!';

            const best = parseInt(localStorage.getItem(BEST_KEY) || '0');
            if (state.score > best) {
                localStorage.setItem(BEST_KEY, state.score);
                newRecordEl.style.display = 'inline-block';
                showBestScore();
            } else {
                newRecordEl.style.display = 'none';
            }

            hud.style.display = 'none';
            resultScreen.classList.remove('hidden');

            const name = localStorage.getItem('aim_player_name') || 'Аноним';
            saveStatus.textContent = 'Сохраняю в топ...';
            saveStatus.style.color = '#8da2c0';

            saveScore(name, state.score).then(ok => {
                if (ok) {
                    saveStatus.textContent = '✅ Сохранено в общий топ!';
                    saveStatus.style.color = '#6ec6a0';
                } else {
                    saveStatus.textContent = '⚠️ Не удалось сохранить';
                    saveStatus.style.color = '#ff4444';
                }
            });
        }

        playBtn.addEventListener('click', startGame);
        againBtn.addEventListener('click', startGame);
        menuBtn.addEventListener('click', () => {
            resultScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
            gameArea.innerHTML = '';
        });

        gameArea.addEventListener('click', (e) => {
            if (!state.playing) return;
            if (e.target.classList.contains('target') || e.target.closest('.target')) return;
            state.misses++;
            state.combo = 0;
            updateHUD();

            const miss = document.createElement('div');
            miss.className = 'miss-effect';
            miss.style.left = e.clientX + 'px';
            miss.style.top = e.clientY + 'px';
            document.body.appendChild(miss);
            setTimeout(() => miss.remove(), 500);
        });

        nameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') startGame();
        });
    </script>
</body>
  </html>
