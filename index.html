<!DOCTYPE html>
<html lang="ru">
<head>
    < charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a2639">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Ruslaanchik — Twitch стример</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-start: #1a2639; --bg-end: #2a3b4c;
            --text: #eef4ff; --text-soft: #b8c7dd; --text-dim: #8da2c0;
            --panel-bg: rgba(18, 28, 40, 0.9);
            --panel-bg-drag: rgba(22, 34, 50, 0.95);
            --panel-border: rgba(255, 255, 255, 0.1);
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.06);
            --card-hover: rgba(255, 255, 255, 0.08);
            --accent: #a7c8ff;
            --twitch-purple: #9146ff;
            --jade-light: #a8e6cf; --jade-mid: #6ec6a0; --jade-deep: #3a8b6e;
            --jade-dark: #235c4a; --jade-shadow: #1a4738;
            --jade-glow: rgba(110, 198, 160, 0.4);
            --scroll-roll-light: #c9f0dd; --scroll-roll-mid: #7dd3ae;
            --scroll-roll-dark: #2f7a5d; --scroll-roll-edge: #1a4d3a;
        }
        body.light {
            --bg-start: #e8f0ff; --bg-end: #d4e0f5;
            --text: #1a2639; --text-soft: #3a4a63; --text-dim: #6b7a94;
            --panel-bg: rgba(255, 255, 255, 0.92);
            --panel-border: rgba(0, 0, 0, 0.08);
            --card-bg: rgba(0, 0, 0, 0.03);
            --card-border: rgba(0, 0, 0, 0.06);
            --card-hover: rgba(0, 0, 0, 0.06);
            --accent: #3a8b6e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overscroll-behavior: none; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, var(--bg-start) 0%, var(--bg-end) 100%);
            background-attachment: fixed;
            min-height: 100vh; min-height: 100dvh;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            color: var(--text); overflow-x: hidden;
            transition: background 0.4s ease, color 0.4s ease;
        }
        .update-banner {
            position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
            max-width: 640px; width: calc(100% - 24px);
            background: linear-gradient(135deg, rgba(145, 70, 255, 0.15), rgba(110, 198, 160, 0.15));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(145, 70, 255, 0.4);
            border-radius: 20px; padding: 14px;
            z-index: 10000;
            box-shadow: 0 20px 40px -10px rgba(145, 70, 255, 0.5);
            animation: bannerSlide 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transition: opacity 0.4s, transform 0.4s;
        }
        .update-banner.hidden { opacity: 0; visibility: hidden; transform: translateX(-50%) translateY(-20px); pointer-events: none; }
        @keyframes bannerSlide {
            from { opacity: 0; transform: translateX(-50%) translateY(-30px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .update-content { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .update-icon { font-size: 2rem; flex-shrink: 0; animation: updatePulse 1.5s ease-in-out infinite; }
        @keyframes updatePulse {
            0%, 100% { transform: scale(1) rotate(-5deg); }
            50% { transform: scale(1.15) rotate(5deg); }
        }
        .update-text { flex: 1; min-width: 0; }
        .update-title {
            font-size: 0.95rem; font-weight: 800;
            background: linear-gradient(135deg, #c2a4ff, #6ec6a0);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            margin-bottom: 2px;
        }
        .update-desc { font-size: 0.78rem; color: var(--text-soft); line-height: 1.4; }
        .update-close {
            width: 32px; height: 32px; border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text); font-size: 1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.15s, background 0.2s;
            font-family: inherit; line-height: 1;
        }
        .update-close:hover { background: rgba(255, 255, 255, 0.15); transform: rotate(90deg); }
        .update-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            width: 100%; padding: 10px 16px; border-radius: 12px;
            background: linear-gradient(135deg, #9146ff, #6ec6a0);
            color: #fff; font-size: 0.85rem; font-weight: 700;
            text-decoration: none;
            box-shadow: 0 8px 20px -6px rgba(145, 70, 255, 0.6);
            text-transform: uppercase; letter-spacing: 1px;
        }
        .update-btn:active { transform: scale(0.98); }

        .top-controls {
            position: fixed; top: max(12px, env(safe-area-inset-top));
            left: 12px; right: 12px;
            display: flex; justify-content: space-between; align-items: center;
</html>
